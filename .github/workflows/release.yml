name: Veröffentlichung

# Ein Tag wie v0.2.0 baut die Mac-App und die Android-App und hängt beide an
# eine Veröffentlichung auf GitHub.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Version aus dem Tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "$version"
          echo "VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_ENV"
      - name: Tests
        run: ./gradlew testDebugUnitTest
      - name: App bauen und signieren
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: kodiscreencast
        run: |
          export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "KodiScreencast-$VERSION_NAME.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: android/KodiScreencast-*.apk

  mac:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v7
      - name: Version aus dem Tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $version" Info.plist
          echo "VERSION_NAME=$version" >> "$GITHUB_ENV"
      - name: Tests
        run: swift test
      - name: App bauen
        run: |
          ./build-app.sh
          cp build/KodiScreencast.zip "KodiScreencast-$VERSION_NAME-mac.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: mac/KodiScreencast-*-mac.zip

  release:
    needs: [android, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          merge-multiple: true
      - name: Veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes KodiScreencast-*
